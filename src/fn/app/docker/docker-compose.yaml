services:
  app:
    image: fuji-autosave:fpk-1.0.2-test.1
    build:
      context: .
    pull_policy: build
    platform: linux/amd64
    container_name: fuji-autosave
    hostname: fuji-autosave
    network_mode: host
    restart: unless-stopped
    volumes:
      - "${wizard_path:?请选择备份目录}:/root/Photos"
